# The game is a workspace package depending on @chain/casino-sdk via file:../..,
# so the install and build must run from the repo root, not from examples/ledge.
[build]
  command = "npm ci && npm run build:ledge"
  publish = "examples/ledge/dist"

# Only chain.wtf (the casino host) and its subdomains (the jam gallery, which iframes
# entries for preview) may frame the game. Everything else is refused, so a look-alike
# site cannot frame the live game and overlay deceptive UI over the bet controls.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://chain.wtf https://*.chain.wtf"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The chain.wtf host fetches the manifest cross-origin, so CORS must stay open.
[[headers]]
  for = "/game.manifest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
